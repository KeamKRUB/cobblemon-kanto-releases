name: Build verified client release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to upload
        required: true
        default: v2026.11.13.1
permissions:
  contents: write
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reconstruct and verify client payload
        run: python3 release/rebuild.py
      - name: Attach payload to the prepared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" out/Cobblemon-Online-Payload.zip --repo "$GITHUB_REPOSITORY"
